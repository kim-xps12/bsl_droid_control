[project]
name = "bsl-droid-sysid"
version = "0.1.0"
description = "Motor system identification optimizer for RS-02 QDD"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mujoco>=3.4.0",
    "scipy>=1.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysid"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pandas-stubs",
]

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 120
target-version = "py310"
include = ["sysid/**/*.py", "*.py"]
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "E741", "E402", "N806", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["sysid"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["sysid/"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "scipy.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true
