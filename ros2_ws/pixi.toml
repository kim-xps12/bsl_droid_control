[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "my_ros2_project"
platforms = ["linux-aarch64", "osx-arm64"]
version = "0.1.0"

[activation]
scripts = ["activate.sh"]

# Jetson用環境変数
[target.linux-aarch64.activation.env]
DISPLAY = ":1"

[tasks]
rviz2 = "rviz2"
format-cpp = { cmd = "clang-format -i src/robstride_hardware/include/robstride_hardware/*.hpp src/robstride_hardware/src/*.cpp src/robstride_hardware/test/*.cpp" }
check-format-cpp = { cmd = "clang-format --dry-run --Werror src/robstride_hardware/include/robstride_hardware/*.hpp src/robstride_hardware/src/*.cpp src/robstride_hardware/test/*.cpp" }
lint-cpp = { cmd = "ament_cpplint --linelength 100 --filters=-build/header_guard src/robstride_hardware/include/robstride_hardware/*.hpp src/robstride_hardware/src/*.cpp src/robstride_hardware/test/*.cpp" }

# macOS: robstride_hardware はLinux専用（linux/can.h依存）のため除外
[target.osx-arm64.tasks]
build = { cmd = "./scripts/run_colcon_build.sh --packages-ignore robstride_hardware", inputs = ["src", "scripts/run_colcon_build.sh"] }

# Jetson: 全パッケージをビルド
[target.linux-aarch64.tasks]
build = { cmd = "./scripts/run_colcon_build.sh", inputs = ["src", "scripts/run_colcon_build.sh"] }

# ========================================
# 共通依存関係（両プラットフォームで利用可能）
# ========================================
[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-turtlesim = ">=1.8.3,<2"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-ament-cmake-auto = ">=2.5.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = ">=4.2.2,<5"
ninja = ">=1.13.2,<2"
pyqt = ">=5.15"
filelock = ">=3.20.3,<4"
numpy = ">=2.0"  # ros-jazzy-std-msgs is built with numpy 2 (np2); numpy 1.x lacks _core/include
ros-jazzy-joy = "*"
ros-jazzy-teleop-twist-joy = "*"
ros-jazzy-ros2-control = ">=4.42.1,<5"
ros-jazzy-ros2-controllers = ">=4.36.0,<5"
ros-jazzy-controller-manager = ">=4.42.1,<5"
ros-jazzy-hardware-interface = ">=4.42.1,<5"
ros-jazzy-joint-state-broadcaster = ">=4.36.0,<5"
ros-jazzy-joint-trajectory-controller = ">=4.36.0,<5"
ros-jazzy-forward-command-controller = ">=4.36.0,<5"
pytorch = "*"
clang-format = ">=18"
# NOTE: genesis-world はpixi pypi-dependenciesではpillow版競合により追加不可。
# activate.shで自動インストールする（pip install --no-deps genesis-world）。
