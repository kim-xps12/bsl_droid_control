# Trajectory Replay: Foot trajectory (CamberTrajectory + IK)
# aoba_description parameters

trajectory_replay:
  ros__parameters:
    source_type: "foot"
    mode: "viz"
    publish_rate: 50.0
    enabled: true

    # Initialization ramp (control mode only)
    init_duration: 1.5        # seconds to ramp from current pose to trajectory start
    init_state_timeout: 10.0  # seconds to wait for /joint_states before aborting

    # Gamepad joystick speed control (enabled via gamepad:=true launch arg)
    # joy_speed_control: false   # Set true to enable /joy subscription
    # joy_axis: 1                # Left stick Y-axis (F710)
    # joy_axis_invert: false      # Set true to negate axis value
    # joy_deadzone: 0.08         # Deadzone threshold

    foot:
      step_height: 0.03
      step_length: 0.15
      step_frequency: 3.0
      leg_extension_ratio: 0.75   # +10mm lower from 0.71
      thigh_length: 0.125
      shank_length: 0.13
