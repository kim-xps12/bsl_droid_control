# Trajectory Replay: Foot trajectory (CamberTrajectory + IK)
# aoba_description parameters

trajectory_replay:
  ros__parameters:
    source_type: "foot"
    mode: "viz"
    publish_rate: 50.0
    enabled: true

    # Initialization ramp (control mode only)
    init_duration: 1.5        # seconds to ramp from current pose to trajectory start
    init_state_timeout: 10.0  # seconds to wait for /joint_states before aborting

    foot:
      step_height: 0.02
      step_length: 0.12
      step_frequency: 0.5
      leg_extension_ratio: 0.75   # +10mm lower from 0.71
      thigh_length: 0.125
      shank_length: 0.13
